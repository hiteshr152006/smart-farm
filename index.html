<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌾 Smart Farm</title>
  <style>
    :root {
      --bg: #eef6ed;
      --card: #ffffff;
      --tx: #17321b;
      --mut: #68766a;
      --pri: #2f7d32;
      --bd: #dfe8dc;
      --red: #c83d43;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111811;
        --card: #1c251c;
        --tx: #edf6ed;
        --mut: #aebaaa;
        --pri: #72bd75;
        --bd: #354135;
        --red: #ff6b70;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--tx);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding-bottom: calc(78px + env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    button, input, select, textarea { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; transition: transform .08s ease; }
    button:active { transform: scale(.97); }
    .app { width: 100%; max-width: 720px; margin: 0 auto; padding: 18px 14px 24px; }
    h1 { margin: 0 0 16px; font-size: 24px; }
    h2 { margin: 0 0 14px; font-size: 17px; }
    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .top-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .stat { min-height: 92px; }
    .stat-label { color: var(--mut); font-size: 13px; margin-bottom: 7px; }
    .stat-value { font-size: 22px; font-weight: 800; }
    .negative { color: var(--red); }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; color: var(--mut); font-size: 12px; font-weight: 700; margin-bottom: 5px; }
    input, select, textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--bd);
      border-radius: 16px;
      background: var(--card);
      color: var(--tx);
      padding: 10px 12px;
      font: inherit;
      font-size: 16px;
    }
    textarea { min-height: 70px; resize: vertical; }
    .add-button, .action-button {
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      background: var(--pri);
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      padding: 10px 14px;
    }
    .action-button { width: 100%; margin-top: 8px; }
    .action-button.secondary { background: var(--card); color: var(--pri); border: 1px solid var(--pri); }
    .list { display: flex; flex-direction: column; gap: 8px; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--bd);
      padding: 10px 0;
    }
    .row:last-child { border-bottom: 0; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 800; word-break: break-word; }
    .row-detail { color: var(--mut); font-size: 13px; margin-top: 3px; word-break: break-word; }
    .delete-button {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 1px solid var(--bd);
      border-radius: 50%;
      background: transparent;
      color: var(--red);
      font-size: 18px;
    }
    .empty { color: var(--mut); text-align: center; padding: 18px 8px; }
    .bar-row { margin: 12px 0; }
    .bar-label { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
    .bar-track { height: 10px; background: var(--bd); border-radius: 999px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--pri); border-radius: 999px; transition: width .25s ease; }
    .nav {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      height: calc(66px + env(safe-area-inset-bottom));
      padding: 6px 4px env(safe-area-inset-bottom);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: var(--card);
      border-top: 1px solid var(--bd);
    }
    .tab {
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--mut);
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
    }
    .tab.active { color: var(--pri); background: color-mix(in srgb, var(--pri) 12%, transparent); }
    .fade { animation: fade .15s ease; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 380px) {
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🌾 Smart Farm</h1>
    <div id="screen"></div>
  </main>
  <nav class="nav" aria-label="Main navigation">
    <button class="tab" data-tab="home">🏠<br>Home</button>
    <button class="tab" data-tab="farms">🌱<br>Farms</button>
    <button class="tab" data-tab="crops">🌾<br>Crops</button>
    <button class="tab" data-tab="expenses">💸<br>Spend</button>
    <button class="tab" data-tab="income">💰<br>Income</button>
  </nav>

  <script>
    const STORAGE_KEY = "smartfarm";
    let db = { farms: [], crops: [], expenses: [], income: [] };
    let activeTab = "home";

    function loadDB() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          db = {
            farms: Array.isArray(parsed.farms) ? parsed.farms : [],
            crops: Array.isArray(parsed.crops) ? parsed.crops : [],
            expenses: Array.isArray(parsed.expenses) ? parsed.expenses : [],
            income: Array.isArray(parsed.income) ? parsed.income : []
          };
        }
      } catch (error) {
        db = { farms: [], crops: [], expenses: [], income: [] };
      }
    }

    function saveDB() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (error) {}
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function money(value) {
      return "₹" + Number(value || 0).toLocaleString("en-IN");
    }

    function today() {
      const date = new Date();
      const offset = date.getTimezoneOffset();
      return new Date(date.getTime() - offset * 60000).toISOString().slice(0, 10);
    }

    const CFG = {
      farms: {
        key: "farms",
        fields: [
          { name: "name", label: "Farm name", type: "text", full: true, required: true },
          { name: "location", label: "Location", type: "text" },
          { name: "acres", label: "Acres", type: "number", step: "0.01" }
        ],
        button: "Add Farm"
      },
      crops: {
        key: "crops",
        fields: [
          { name: "name", label: "Crop name", type: "text", full: true, required: true },
          { name: "farm", label: "Farm", type: "select", options: "farms", full: false },
          { name: "area", label: "Area (acres)", type: "number", step: "0.01" },
          { name: "status", label: "Status", type: "select", options: ["Planned", "Growing", "Harvested"], full: true }
        ],
        button: "Add Crop"
      },
      expenses: {
        key: "expenses",
        fields: [
          { name: "date", label: "Date", type: "date", value: today },
          { name: "category", label: "Category", type: "select", options: ["Seeds", "Fertilizer", "Labour", "Water", "Equipment", "Other"] },
          { name: "amount", label: "Amount", type: "number", step: "0.01", required: true, full: true },
          { name: "note", label: "Note", type: "textarea", full: true }
        ],
        button: "Add Expense"
      },
      income: {
        key: "income",
        fields: [
          { name: "date", label: "Date", type: "date", value: today },
          { name: "source", label: "Source", type: "text", required: true },
          { name: "amount", label: "Amount", type: "number", step: "0.01", required: true, full: true },
          { name: "note", label: "Note", type: "textarea", full: true }
        ],
        button: "Add Income"
      }
    };

    function buildField(field) {
      const value = typeof field.value === "function" ? field.value() : (field.value || "");
      const fullClass = field.full ? " full" : "";
      let control = "";

      if (field.type === "textarea") {
        control = `<textarea id="${escapeHTML(field.name)}" name="${escapeHTML(field.name)}" placeholder="${escapeHTML(field.label)}"></textarea>`;
      } else if (field.type === "select") {
        let options = [];
        if (field.options === "farms") {
          options = db.farms.map(farm => ({ value: farm.name, label: farm.name }));
        } else {
          options = field.options.map(option => ({ value: option, label: option }));
        }
        control = `<select id="${escapeHTML(field.name)}" name="${escapeHTML(field.name)}">`;
        control += options.map(option =>
          `<option value="${escapeHTML(option.value)}">${escapeHTML(option.label)}</option>`
        ).join("");
        control += "</select>";
      } else {
        const step = field.step ? ` step="${escapeHTML(field.step)}"` : "";
        control = `<input id="${escapeHTML(field.name)}" name="${escapeHTML(field.name)}" type="${escapeHTML(field.type)}" value="${escapeHTML(value)}"${step} placeholder="${escapeHTML(field.label)}">`;
      }

      return `<div class="field${fullClass}"><label for="${escapeHTML(field.name)}">${escapeHTML(field.label)}</label>${control}</div>`;
    }

    function buildForm(tab) {
      const config = CFG[tab];
      return `
        <form class="card" id="entry-form">
          <div class="form-grid">${config.fields.map(buildField).join("")}</div>
          <button class="add-button" type="submit" style="width:100%;margin-top:12px">${escapeHTML(config.button)}</button>
        </form>`;
    }

    function recordSummary(tab, record) {
      if (tab === "farms") {
        return {
          title: record.name,
          detail: [record.location, record.acres ? record.acres + " acres" : ""].filter(Boolean).join(" · ")
        };
      }
      if (tab === "crops") {
        return {
          title: record.name,
          detail: [record.farm, record.area ? record.area + " acres" : "", record.status].filter(Boolean).join(" · ")
        };
      }
      if (tab === "expenses") {
        return {
          title: money(record.amount),
          detail: [record.date, record.category, record.note].filter(Boolean).join(" · ")
        };
      }
      return {
        title: money(record.amount),
        detail: [record.date, record.source, record.note].filter(Boolean).join(" · ")
      };
    }

    function renderList(tab) {
      const records = db[CFG[tab].key];
      const heading = tab === "expenses" ? "Expenses" : tab === "income" ? "Income" : tab[0].toUpperCase() + tab.slice(1);
      if (!records.length) return `<div class="card"><h2>${heading}</h2><div class="empty">Nothing added yet.</div></div>`;

      const entries = records.map((record, index) => ({ record, index })).reverse().map(({ record, index }) => {
        const summary = recordSummary(tab, record);
        return `
          <div class="row">
            <div class="row-main">
              <div class="row-title">${escapeHTML(summary.title)}</div>
              <div class="row-detail">${escapeHTML(summary.detail)}</div>
            </div>
            <button class="delete-button" type="button" data-delete="${index}" data-tab="${tab}" aria-label="Delete">✕</button>
          </div>`;
      }).join("");

      return `<div class="card"><h2>${heading}</h2><div class="list">${entries}</div></div>`;
    }

    function renderHome() {
      const incomeTotal = db.income.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const expenseTotal = db.expenses.reduce((sum, item) => sum + Number(item.amount || 0), 0);
      const profit = incomeTotal - expenseTotal;
      const categories = ["Seeds", "Fertilizer", "Labour", "Water", "Equipment", "Other"];
      const totals = categories.map(category => ({
        category,
        amount: db.expenses
          .filter(item => item.category === category)
          .reduce((sum, item) => sum + Number(item.amount || 0), 0)
      }));
      const max = Math.max(0, ...totals.map(item => item.amount));

      const bars = totals.length ? totals.map(item =>
        `<div class="bar-row">
          <div class="bar-label"><span>${escapeHTML(item.category)}</span><strong>${money(item.amount)}</strong></div>
          <div class="bar-track"><div class="bar-fill" style="width:${max ? (item.amount / max * 100).toFixed(2) : 0}%"></div></div>
        </div>`
      ).join("") : `<div class="empty">Nothing added yet.</div>`;

      return `
        <div class="top-grid">
          <div class="card stat"><div class="stat-label">Income</div><div class="stat-value">${money(incomeTotal)}</div></div>
          <div class="card stat"><div class="stat-label">Expenses</div><div class="stat-value">${money(expenseTotal)}</div></div>
          <div class="card stat"><div class="stat-label">Profit</div><div class="stat-value ${profit < 0 ? "negative" : ""}">${money(profit)}</div></div>
          <div class="card stat"><div class="stat-label">Farms / Crops</div><div class="stat-value">${db.farms.length} / ${db.crops.length}</div></div>
        </div>
        <div class="card">
          <h2>Spending by category</h2>
          ${bars}
        </div>
        <button class="action-button" id="download-csv" type="button">Download CSV report</button>
        <button class="action-button secondary" id="load-sample" type="button">Load sample data</button>`;
    }

    function render() {
      const screen = document.getElementById("screen");
      screen.classList.remove("fade");
      void screen.offsetWidth;
      screen.classList.add("fade");

      if (activeTab === "home") {
        screen.innerHTML = renderHome();
      } else {
        screen.innerHTML = buildForm(activeTab) + renderList(activeTab);
      }

      document.querySelectorAll(".tab").forEach(button => {
        button.classList.toggle("active", button.dataset.tab === activeTab);
      });
      bindScreenEvents();
    }

    function bindScreenEvents() {
      const form = document.getElementById("entry-form");
      if (form) {
        form.addEventListener("submit", event => {
          event.preventDefault();
          const config = CFG[activeTab];
          const data = Object.create(null);
          let valid = true;

          config.fields.forEach(field => {
            const element = form.elements[field.name];
            data[field.name] = element ? element.value.trim() : "";
          });

          if (activeTab === "farms" && !data.name) valid = false;
          if (activeTab === "crops" && !data.name) valid = false;
          if ((activeTab === "expenses" || activeTab === "income") && !data.amount) valid = false;
          if (activeTab === "income" && !data.source) valid = false;

          if (!valid) {
            alert("Please fill in the main field.");
            return;
          }

          if (activeTab === "expenses" || activeTab === "income") data.amount = Number(data.amount);
          if (activeTab === "farms" || activeTab === "crops") {
            if (data.acres) data.acres = Number(data.acres);
            if (data.area) data.area = Number(data.area);
          }

          db[config.key].push(data);
          saveDB();
          if (navigator.vibrate) navigator.vibrate(35);
          render();
        });
      }

      document.querySelectorAll("[data-delete]").forEach(button => {
        button.addEventListener("click", () => {
          if (!confirm("Delete this record?")) return;
          const tab = button.dataset.tab;
          const index = Number(button.dataset.delete);
          db[CFG[tab].key].splice(index, 1);
          saveDB();
          render();
        });
      });

      const download = document.getElementById("download-csv");
      if (download) download.addEventListener("click", downloadCSV);

      const sample = document.getElementById("load-sample");
      if (sample) sample.addEventListener("click", loadSampleData);
    }

    function csvCell(value) {
      const text = String(value ?? "");
      return '"' + text.replace(/"/g, '""') + '"';
    }

    function downloadCSV() {
      const rows = [["type", "date", "detail", "amount"]];
      db.expenses.forEach(item => rows.push(["expense", item.date || "", `${item.category}${item.note ? " - " + item.note : ""}`, item.amount]));
      db.income.forEach(item => rows.push(["income", item.date || "", `${item.source}${item.note ? " - " + item.note : ""}`, item.amount]));
      const csv = rows.map(row => row.map(csvCell).join(",")).join("\r\n");

      try {
        const url = "data:text/plain;charset=utf-8," + encodeURIComponent(csv);
        const opened = window.open(url, "_blank");
        if (!opened) alert(csv);
      } catch (error) {
        alert(csv);
      }
    }

    function loadSampleData() {
      db = {
        farms: [
          { name: "Green Valley", location: "Pune", acres: 12.5 },
          { name: "Sunrise Acres", location: "Nashik", acres: 8 }
        ],
        crops: [
          { name: "Soybean", farm: "Green Valley", area: 6, status: "Growing" },
          { name: "Sugarcane", farm: "Sunrise Acres", area: 8, status: "Planned" },
          { name: "Wheat", farm: "Green Valley", area: 5, status: "Harvested" }
        ],
        expenses: [
          { date: today(), category: "Seeds", amount: 28000, note: "Season seed stock" },
          { date: today(), category: "Fertilizer", amount: 18500, note: "Organic fertilizer" },
          { date: today(), category: "Labour", amount: 22000, note: "Harvest crew" },
          { date: today(), category: "Water", amount: 7200, note: "Irrigation" }
        ],
        income: [
          { date: today(), source: "Wheat sale", amount: 65000, note: "Market sale" },
          { date: today(), source: "Soybean sale", amount: 42000, note: "Cooperative sale" }
        ]
      };
      saveDB();
      render();
      if (navigator.vibrate) navigator.vibrate(35);
    }

    document.querySelectorAll(".tab").forEach(button => {
      button.addEventListener("pointerdown", () => {
        activeTab = button.dataset.tab;
        render();
      });
    });

    loadDB();
    render();
  </script>
</body>
</html>
